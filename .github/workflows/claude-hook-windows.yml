name: Claude Hook Windows Runtime

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate standalone runtime
        shell: pwsh
        run: |
          pnpm typecheck; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm typecheck:test; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm vitest run src/__tests__/claude-hook-assets.test.ts src/__integration__/claude-pretooluse-exec.integration.test.ts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify packaged helper assets ship
        shell: pwsh
        run: |
          pnpm package:check; if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # First-ever execution surface for the digest-bound
      # javi-forge-windows-secure-object.ps1: drives the REAL
      # createWindowsSecureFs(createPs1Session()) against real NTFS fixtures
      # (icacls / mklink /J / .NET Set-Acl) on the C: volume. This suite is
      # win32-gated (describe.skipIf) so it is inert on Linux and only runs here.
      # A RED result means the .ps1 needs a fix — do NOT mask it.
      - name: Validate real win32 secure-object helper (.ps1)
        shell: pwsh
        run: |
          pnpm vitest run src/__integration__/secure-fs-windows.integration.test.ts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
