# ===========================================
# Reusable Workflow: Docker Build & Push
# ===========================================
# Build and push to GitHub Container Registry.
#
# Usage:
#   jobs:
#     docker:
#       uses: JNZader/javi-forge/.github/workflows/reusable-docker.yml@main
#       with:
#         dockerfile: './Dockerfile'
# ===========================================

name: Docker (Reusable)

on:
  workflow_call:
    inputs:
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        default: './Dockerfile'
        type: string
      context:
        description: 'Docker build context'
        required: false
        default: '.'
        type: string
      image-name:
        description: 'Image name (defaults to repo name)'
        required: false
        default: ''
        type: string
      platforms:
        description: 'Target platforms'
        required: false
        default: 'linux/amd64'
        type: string
      push:
        description: 'Push to registry'
        required: false
        default: true
        type: boolean
      build-args:
        description: 'Docker build arguments'
        required: false
        default: ''
        type: string

jobs:
  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate inputs
        env:
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          if [ -n "$BUILD_ARGS" ] && echo "$BUILD_ARGS" | grep -qE '[;|&$`(){}<>]'; then
            echo "::error::Invalid characters in build-args input."
            exit 1
          fi

      - name: Set image name
        id: image
        env:
          INPUT_IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          if [ -n "$INPUT_IMAGE_NAME" ]; then
            echo "name=$INPUT_IMAGE_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup QEMU
        if: contains(inputs.platforms, ',')
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
