name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - run: pnpm install --frozen-lockfile

      # Dependency audit — runs BEFORE build/test so a fresh CVE in the
      # tree surfaces even when an unrelated test happens to be flaky.
      # The threshold is "high" so noisy moderate/low advisories do not
      # break the build. Audit (2026-05-17) flagged the previous ordering.
      - name: pnpm audit (high+)
        run: pnpm audit --audit-level=high

      # ci-mixed-integration.test.ts expects the real ruff from PATH (the
      # backend runner declares it in requires). Before the mixed-stack
      # integration tests, previous green runs predated that test.
      # Install from PyPI (checksummed, pinned) via preinstalled pipx instead
      # of `curl | sh` (semgrep gha-curl-pipe-shell): piping a remote script
      # to a shell runs arbitrary code if astral.sh is compromised/hijacked.
      # pipx drops the ruff shim in ~/.local/bin, already added to PATH below.
      - name: Install ruff (from integration tests)
        run: |
          pipx install ruff==0.15.6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: pnpm build
      # COV-2: run tests WITH coverage so the configured 85/80 floor
      # (vitest.config.ts) actually gates on CI. Local `pnpm validate` keeps
      # running plain `pnpm test` (no per-commit coverage friction / jitter).
      - run: pnpm test:coverage
      - run: pnpm package:check

      # ─── Dogfooding: javi-forge must use its own tools on itself ──────
      # Without this we'd be a security tool that doesn't eat its own
      # cooking. Audit 2026-05-17 flagged this as a credibility issue.

      # Hook regression suite — proves the commit-msg blocker is alive and
      # matches what's declared in commit-msg.test.sh.
      - name: Run commit-msg hook regression suite
        run: pnpm test:hooks

      # Self-CI — exercises javi-forge's own ci pipeline against itself
      # (stack detection, build, tests, security scan). We install from
      # `npm pack` rather than `npm install -g .` so the runner exercises
      # the same tarball that end users will receive — `--silent` on a
      # source install used to hide a stale local cache picking up a
      # different version. --no-docker keeps the runtime under the
      # runner's quota; --no-ci-ghagga avoids a cyclic dependency on the
      # ghagga binary in this repo.
      - name: Self-CI (javi-forge ci --quick from packed tarball)
        run: |
          set -euo pipefail
          npm pack
          npm install -g ./javi-forge-*.tgz
          rm -f ./javi-forge-*.tgz
          javi-forge ci --quick --no-docker --no-ci-ghagga
