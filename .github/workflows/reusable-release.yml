# ===========================================
# Reusable Workflow: Semantic Release
# ===========================================
# Automatic versioning based on conventional commits.
#
# Usage:
#   jobs:
#     release:
#       uses: JNZader/javi-forge/.github/workflows/reusable-release.yml@main
#       secrets:
#         token: ${{ secrets.GITHUB_TOKEN }}
# ===========================================

name: Release (Reusable)

on:
  workflow_call:
    inputs:
      dry-run:
        description: 'Dry run'
        required: false
        default: false
        type: boolean
      node-version:
        description: 'Node.js version'
        required: false
        default: '22'
        type: string
    secrets:
      token:
        description: 'GitHub token with contents:write permission'
        required: true
      npm-token:
        description: 'NPM token for package publishing (optional)'
        required: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Cache semantic-release
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: semantic-release-${{ runner.os }}-${{ hashFiles('.releaserc*') }}
          restore-keys: semantic-release-${{ runner.os }}-

      # Versions are pinned: this job runs with GITHUB_TOKEN + NPM_TOKEN in the
      # environment, so an unpinned install would execute whatever npm serves as
      # "latest" at run time with publish credentials in reach. Consumer repos do
      # not share this repo's lockfile, so explicit versions stand in for it.
      # Keep in sync manually (npm view <pkg> version).
      - name: Install semantic-release
        run: |
          npm install -g semantic-release@25.0.9 \
            @semantic-release/commit-analyzer@13.0.1 \
            @semantic-release/release-notes-generator@14.1.1 \
            @semantic-release/changelog@7.0.0 \
            @semantic-release/git@11.0.1 \
            @semantic-release/github@12.0.9 \
            conventional-changelog-conventionalcommits@10.3.0

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.token }}
          NPM_TOKEN: ${{ secrets.npm-token }}
          DRY_RUN: ${{ inputs.dry-run }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          if [ "$DRY_RUN" == "true" ]; then
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi
