# ===========================================
# Reusable Workflow: Java/Gradle Build
# ===========================================
# Minimal CI for Java projects - saves CI minutes.
#
# Usage in your project:
#   jobs:
#     build:
#       uses: JNZader/javi-forge/.github/workflows/reusable-build-java.yml@main
#       with:
#         java-version: '21'
# ===========================================

name: Java Build (Reusable)

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version (17, 21, 25)'
        required: false
        default: '21'
        type: string
      gradle-tasks:
        description: 'Gradle tasks to run'
        required: false
        default: 'classes'
        type: string
      run-tests:
        description: 'Run tests (uses more minutes)'
        required: false
        default: true
        type: boolean
      run-spotless:
        description: 'Run Spotless format check'
        required: false
        default: true
        type: boolean
      working-directory:
        description: 'Working directory'
        required: false
        default: '.'
        type: string
      gradle-args:
        description: 'Additional Gradle arguments'
        required: false
        default: ''
        type: string
      lint-fail-on-error:
        description: 'Fail the build if linting fails'
        required: false
        default: true
        type: boolean

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.caching=true'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate inputs
        env:
          ARGS: ${{ inputs.gradle-args }}
        run: |
          if echo "$ARGS" | grep -qE '[;|&$`(){}<>'"'"'"]'; then
            echo "::error::Invalid characters in input arguments. Shell metacharacters are not allowed."
            exit 1
          fi

      - name: Setup Java ${{ inputs.java-version }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Compile
        env:
          GRADLE_TASKS: ${{ inputs.gradle-tasks }}
          GRADLE_ARGS: ${{ inputs.gradle-args }}
        run: ./gradlew $GRADLE_TASKS --no-daemon $GRADLE_ARGS

      - name: Spotless Check
        if: inputs.run-spotless
        continue-on-error: ${{ !inputs.lint-fail-on-error }}
        run: ./gradlew spotlessCheck --no-daemon

      - name: Test
        if: inputs.run-tests
        env:
          GRADLE_ARGS: ${{ inputs.gradle-args }}
        run: ./gradlew test --no-daemon $GRADLE_ARGS

      - name: Upload test results
        if: inputs.run-tests && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: '**/build/reports/tests/'
          retention-days: 7
