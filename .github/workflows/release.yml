name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      # ci-mixed.integration.test.ts exercises the real ci pipeline, whose
      # backend runner requires ruff from PATH. GitHub's ubuntu-latest image
      # does not include it, so install it before running the suite.
      # Install from PyPI (checksummed, pinned) via preinstalled pipx instead
      # of `curl | sh` (semgrep gha-curl-pipe-shell): piping a remote script
      # to a shell runs arbitrary code if astral.sh is compromised/hijacked.
      # pipx drops the ruff shim in ~/.local/bin, already added to PATH below.
      - name: Install ruff (required tool for integration tests)
        run: |
          pipx install ruff==0.15.6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pnpm build
      - run: pnpm test
      - run: pnpm package:check
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm exec semantic-release
