# ===========================================
# Reusable Workflow: Python Build
# ===========================================
# Minimal CI for Python projects.
#
# Usage:
#   jobs:
#     build:
#       uses: JNZader/javi-forge/.github/workflows/reusable-build-python.yml@main
#       with:
#         python-version: '3.12'
# ===========================================

name: Python Build (Reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version'
        required: false
        default: '3.12'
        type: string
      package-manager:
        description: 'Package manager (pip, poetry, uv)'
        required: false
        default: 'pip'
        type: string
      run-tests:
        description: 'Run tests'
        required: false
        default: true
        type: boolean
      run-lint:
        description: 'Run linting (ruff)'
        required: false
        default: true
        type: boolean
      working-directory:
        description: 'Working directory'
        required: false
        default: '.'
        type: string
      lint-fail-on-error:
        description: 'Fail the build if linting fails'
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: ${{ inputs.package-manager == 'poetry' && 'poetry' || inputs.package-manager == 'pip' && 'pip' || '' }}
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml
            **/poetry.lock

      - name: Install uv
        if: inputs.package-manager == 'uv'
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Install Poetry
        if: inputs.package-manager == 'poetry'
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2

      - name: Install dependencies (pip)
        if: inputs.package-manager == 'pip'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Install dependencies (poetry)
        if: inputs.package-manager == 'poetry'
        run: poetry install

      - name: Install dependencies (uv)
        if: inputs.package-manager == 'uv'
        run: uv sync

      - name: Install dev tools
        if: inputs.package-manager == 'pip'
        run: pip install --quiet ruff mypy pytest

      - name: Install dev tools (poetry)
        if: inputs.package-manager == 'poetry'
        run: poetry run pip install --quiet ruff mypy pytest

      - name: Install dev tools (uv)
        if: inputs.package-manager == 'uv'
        run: uv pip install --quiet ruff mypy pytest

      - name: Lint (ruff)
        if: inputs.run-lint
        continue-on-error: ${{ !inputs.lint-fail-on-error }}
        env:
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          if [ "$PKG_MGR" = "uv" ]; then
            uv run ruff check .
          else
            ruff check .
          fi

      - name: Type check
        if: hashFiles('mypy.ini') != '' || hashFiles('setup.cfg') != '' || hashFiles('pyproject.toml') != ''
        continue-on-error: true
        env:
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          if [ "$PKG_MGR" = "uv" ]; then
            uv run mypy . --ignore-missing-imports
          else
            mypy . --ignore-missing-imports
          fi

      - name: Test
        if: inputs.run-tests
        env:
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          if [ "$PKG_MGR" = "poetry" ]; then
            poetry run pytest
          elif [ "$PKG_MGR" = "uv" ]; then
            uv run pytest
          else
            pytest
          fi

      - name: Upload test results
        if: inputs.run-tests && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-python
          path: |
            htmlcov/
            .coverage
            junit.xml
            test-results/
          retention-days: 7
          if-no-files-found: ignore
