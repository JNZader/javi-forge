# Local AI Development Stack
# Generated by javi-forge — https://github.com/JNZader/javi-forge
#
# Usage:
#   docker compose up -d              # Start Ollama (core)
#   docker compose --profile ui up -d # Start Ollama + Open WebUI
#   docker compose --profile auto up -d # Start Ollama + n8n + Open WebUI
#   docker compose --profile full up -d # Start everything
#
# Pull a model after starting:
#   docker exec ollama ollama pull llama3.2
#   docker exec ollama ollama pull codellama

services:
  # ── Core: Ollama (local LLM inference) ────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      # Bound to loopback by default — this is a LOCAL dev stack. To expose on
      # your LAN, change 127.0.0.1 to your interface IP (opt-in, not default).
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    # Uncomment for NVIDIA GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Optional: Open WebUI (chat interface) ─────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    profiles: ["ui", "auto", "full"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3000}:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      # Auth ON by default. Set WEBUI_AUTH=false in .env only if you accept an
      # unauthenticated UI (loopback-only mitigates, but any local process can reach it).
      - WEBUI_AUTH=${WEBUI_AUTH:-true}
    depends_on:
      ollama:
        condition: service_healthy

  # ── Optional: n8n (workflow automation) ───────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    profiles: ["auto", "full"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - N8N_SECURE_COOKIE=false
      - OLLAMA_HOST=http://ollama:11434

  # ── Optional: Supabase (Postgres + Auth + Realtime) ───────────────────────
  supabase-db:
    image: supabase/postgres:15.6.1.145
    container_name: supabase-db
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SUPABASE_DB_PORT:-5432}:5432"
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
    environment:
      # No insecure default — REQUIRED. If unset/empty, Postgres refuses to
      # initialize ("superuser password is not specified"): set it in .env.
      # Note: a compose-level `:?` guard would also break the core (ollama-only)
      # profile at parse time, so the check is delegated to the postgres image.
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD}
      POSTGRES_DB: ${SUPABASE_DB_NAME:-app}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
  open_webui_data:
  n8n_data:
  supabase_db_data:
